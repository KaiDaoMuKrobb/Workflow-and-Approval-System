# ##############################################################################
# CI — "CI & Docker Build"
# ##############################################################################
# Runs the project's checks, and is used in two ways:
#   1) directly on every pull request into `main` and `staging`, and
#   2) as a reusable workflow called by deploy.yml (`workflow_call`), so a
#      deployment only starts after these checks pass.
# It does not deploy anything.
#
# DO NOT RENAME the job id `test-and-docker`: the protect-main ruleset selects
# the required status check by that name.
#
# Adapted from the Lab 5 starter kit for ExpenseFlow: one Next.js application at
# the repository root instead of the kit's split client/server layout.
# ##############################################################################

name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throw-away PostgreSQL for the tests only. These are CI values, never real
    # secrets. The user, password and database match .env.example so the same
    # connection string works locally and here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expenseflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expenseflow?schema=public
      JWT_SECRET: ci-only-not-a-real-secret
      SEED_DEMO_DATA: "true"
      DEMO_USER_PASSWORD: ci-only-demo-password

    steps:
      # Third-party actions are pinned to a commit SHA; the comment shows the
      # version. .github/dependabot.yml opens a PR when a newer one appears.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Python is needed only by the deploy smoke-test unit tests below.
      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Guards deploy.sh, release.sh and smoke_test.py so a broken script is
      # caught here rather than during a deployment. Nothing touches GCP.
      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Migrate and seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Run tests
        run: npm test

      - name: Build the application
        run: npm run build

      # The image is built but never pushed here.
      - name: Verify the production image builds
        run: docker build -t expenseflow:ci .
